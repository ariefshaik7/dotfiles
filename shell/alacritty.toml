# ----------------------------
# Window Settings
# ----------------------------
[window]
opacity = 0.85
blur = true
decorations = "full"
dynamic_padding = true

[window.padding]
x = 8
y = 8

# ----------------------------
# Font Settings
# ----------------------------
[font]
size = 12.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

# ----------------------------
# Cursor Settings
# ----------------------------
[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 600
blink_timeout = 0
unfocused_hollow = true

# ----------------------------
# Xterm Color Palette
# ----------------------------

[colors.primary]
background = "#000000"
foreground = "#ffffff"

[colors.normal]
black   = "#000000"
red     = "#cd0000"
green   = "#00cd00"
yellow  = "#cdcd00"
blue    = "#0000ee"
magenta = "#cd00cd"
cyan    = "#00cdcd"
white   = "#e5e5e5"

[colors.bright]
black   = "#7f7f7f"
red     = "#ff0000"
green   = "#00ff00"
yellow  = "#ffff00"
blue    = "#5c5cff"
magenta = "#ff00ff"
cyan    = "#00ffff"
white   = "#ffffff"

# ----------------------------
# Selection
# ----------------------------
[selection]
save_to_clipboard = true

# ----------------------------
# Scrolling
# ----------------------------
[scrolling]
history = 10000
multiplier = 3

# ----------------------------
# Mouse
# ----------------------------
[mouse]
hide_when_typing = true


[keyboard]
bindings = [
 { key = "Plus", mods = "Control|Shift", action = "IncreaseFontSize" },
 { key = "Minus", mods = "Control|Shift", action = "DecreaseFontSize" },
 { key = "Key0", mods = "Control|Shift", action = "ResetFontSize" }
]

[env]
TERM = "xterm-256color"

